<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中英语阅读讲解课件</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#ffffff; --line:#e6eaf0; --ink:#1f2933; --sub:#5b6573;
    --primary:#15616d; --primary-2:#1b7a86; --primary-soft:#e7f1f2; --on-primary:#ffffff;
    --accent:#f0a23b; --hl:#ffe9a8; --hl-2:#ffd966; --locate:#bfe6cf; --read-font:18px;
    --radius:16px; --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --shadow:0 4px 14px rgba(16,24,40,.08);
    --shadow-lg:0 12px 34px rgba(16,24,40,.16);
    --opt-bg:#fbfcfe; --opt-hover:#eef6f6;
    --ok-bg:#e7f8ee; --ok-bd:#16a34a; --ok-ink:#166534;
    --bad-bg:#fdecec; --bad-bd:#dc2626; --bad-ink:#991b1b;
  }
  :root[data-theme="dark"]{
    --bg:#15181d; --panel:#1f242c; --line:#2c333d; --ink:#e8edf2; --sub:#9aa6b2;
    --primary:#3aa6b4; --primary-2:#46c0cf; --primary-soft:#1c2e33; --on-primary:#0e1418;
    --accent:#f0b35e; --hl:#5c4a17; --locate:#1f4d36; --opt-bg:#262d36; --opt-hover:#2e3742;
    --ok-bg:#16301f; --ok-bd:#34d27e; --ok-ink:#86efac;
    --bad-bg:#331c1c; --bad-bd:#f0716e; --bad-ink:#f3a4a1;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 4px 14px rgba(0,0,0,.4); --shadow-lg:0 12px 34px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",-apple-system,system-ui,sans-serif; font-size:15px; line-height:1.65;}

  header{
    background:linear-gradient(135deg, var(--primary), var(--primary-2));
    color:var(--on-primary); padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    box-shadow:var(--shadow);
  }
  .course{font-size:21px; font-weight:800; letter-spacing:.5px; outline:none; flex:1; min-width:240px; text-shadow:0 1px 2px rgba(0,0,0,.15);}
  .course:focus{background:rgba(255,255,255,.18); border-radius:8px; outline:none;}
  .toolbar{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .toolbar .grp{display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.16); padding:5px 9px; border-radius:999px; backdrop-filter:blur(4px);}
  .toolbar .grp span{font-size:12px; opacity:.9;}

  .btn{
    border:1px solid transparent; background:var(--primary); color:#fff; padding:7px 13px;
    border-radius:999px; cursor:pointer; font-size:13.5px; font-weight:600; line-height:1.2;
    display:inline-flex; align-items:center; gap:5px; transition:.15s ease; box-shadow:var(--shadow-sm);
  }
  .btn:hover{transform:translateY(-1px); box-shadow:var(--shadow);}
  .btn:active{transform:translateY(0);}
  .btn.ghost{background:var(--primary-soft); color:var(--primary); border-color:transparent;}
  .btn.mini{padding:5px 11px; font-size:13px;}
  .btn.active{background:#fff; color:var(--primary); font-weight:800; box-shadow:0 0 0 2px rgba(255,255,255,.5) inset;}
  .toolbar .btn{background:rgba(255,255,255,.95); color:var(--primary); box-shadow:none;}
  .toolbar .btn:hover{background:#fff; transform:translateY(-1px);}
  .toolbar .btn.active{background:#fff; color:var(--primary);}

  .tabs{display:flex; gap:8px; padding:14px 20px 0; flex-wrap:wrap;}
  .tab{
    padding:9px 24px; border:1px solid var(--line); border-bottom:none; background:var(--panel);
    color:var(--sub); border-radius:12px 12px 0 0; cursor:pointer; font-size:15px; font-weight:700;
    transition:.15s; box-shadow:var(--shadow-sm);
  }
  .tab:hover{color:var(--primary);}
  .tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; border-color:transparent; box-shadow:var(--shadow);}

  .main{display:flex; gap:18px; padding:0 20px 18px; align-items:stretch; height:calc(100vh - 168px); min-height:440px;}
  .col{background:var(--panel); border:1px solid var(--line); border-radius:0 0 var(--radius) var(--radius); display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow);}
  .col.left{flex:1 1 54%;}
  .col.right{flex:1 1 46%;}
  .col-head{padding:12px 16px; border-bottom:1px solid var(--line); background:var(--primary-soft); color:var(--primary); font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:space-between; gap:8px; box-shadow:0 1px 0 rgba(16,24,40,.03);}
  .col-body{padding:18px 20px; overflow:auto; flex:1;}

  #reading{font-family:"Georgia","Times New Roman","Songti SC","Source Han Serif SC",serif; font-size:var(--read-font); line-height:2; outline:none; color:var(--ink);}
  #reading h3{margin:0 0 14px; color:var(--primary); font-size:1.2em; font-weight:800;}
  #reading p{margin:0 0 16px; position:relative; text-align:justify;}
  #reading b{color:#c2681f; font-weight:700;}
  #reading.sent-mode p.sent{margin:0 0 12px; cursor:pointer; border-radius:10px; padding:8px 10px; border:1px solid transparent; transition:.15s;}
  #reading.sent-mode p.sent:hover{background:var(--primary-soft); border-color:var(--primary); box-shadow:var(--shadow-sm); transform:translateX(2px);}
  mark.hl{background:linear-gradient(180deg,transparent 60%, var(--hl) 60%); border-radius:3px; padding:0 2px;}
  .locate{background:var(--locate); border-radius:4px; padding:0 2px; box-shadow:0 0 0 2px var(--locate); font-weight:600;}
  .trans{margin:2px 0 16px; padding:10px 14px; background:linear-gradient(90deg,var(--primary-soft),#f3f9f9); border-left:4px solid var(--primary); border-radius:0 10px 10px 0; color:var(--sub); font-size:.92em; line-height:1.8; font-family:"PingFang SC",sans-serif;}
  .trans-btn{float:right; margin:0 0 0 8px; font-size:11px; padding:2px 10px; border:1px solid var(--primary); background:#fff; color:var(--primary); border-radius:999px; cursor:pointer; line-height:1.6; font-weight:600;}
  .trans-btn:hover{background:var(--primary); color:#fff;}

  .accum{margin-top:20px; border-top:1px dashed var(--line); padding-top:14px;}
  .accum-head{font-weight:800; color:var(--primary); margin-bottom:10px; font-size:15px;}
  .accum-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0;}
  .acc-cell{padding:0 14px; border-right:1px solid var(--line);}
  .acc-cell:last-child{border-right:none;}
  .acc-cell h4{margin:0 0 8px; color:var(--primary); font-size:13.5px; display:flex; align-items:center; gap:6px;}
  .acc-cell h4::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--accent);}
  .acc-item{margin:4px 0; color:var(--ink); font-size:14px; outline:none; padding:3px 6px; border-radius:6px;}
  .acc-item:focus{background:var(--primary-soft);}

  /* 💡 做题技巧（暖色卡片，与冷色数据列表区分） */
  .accum-tech{margin-top:14px; padding:14px 18px; background:linear-gradient(120deg,#fff7ed,#fef9e7); border:1px solid #fde68a; border-radius:14px; box-shadow:var(--shadow-sm);}
  .accum-tech-head{font-weight:800; color:#b45309; margin-bottom:10px; font-size:14.5px; display:flex; align-items:center; gap:7px;}
  .accum-tech-head::before{content:"💡"; font-size:16px;}
  #techniques{outline:none; color:var(--ink); font-size:14px; line-height:1.8;}
  #techniques:focus{background:rgba(255,255,255,.55); border-radius:8px; padding:4px 6px;}
  .tech-item{display:flex; gap:10px; align-items:flex-start; margin:6px 0; padding:8px 12px; background:rgba(255,255,255,.7); border-left:3px solid var(--accent); border-radius:8px; outline:none; transition:.12s;}
  .tech-item:hover{background:#fff; box-shadow:var(--shadow-sm);}
  .tech-item:focus{background:#fff;}
  .tech-num{flex:none; min-width:24px; height:24px; padding:0 8px; border-radius:12px; background:linear-gradient(135deg,var(--accent),#e09234); color:#fff; font-weight:800; font-size:12px; display:inline-flex; align-items:center; justify-content:center;}
  .tech-txt{flex:1; line-height:1.7;}

  #quiz{outline:none;}
  .question{border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:16px; background:var(--panel); box-shadow:var(--shadow-sm); transition:.15s;}
  .question:hover{box-shadow:var(--shadow);}
  .q-top{display:flex; gap:12px; align-items:flex-start; margin-bottom:12px;}
  .q-num{flex:none; width:28px; height:28px; border-radius:9px; background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:var(--shadow-sm);}
  .q-text{font-weight:700; margin:0; font-size:15.5px; line-height:1.6; color:var(--ink);}
  .opt{display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin:8px 0; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--opt-bg); color:var(--ink); cursor:pointer; font-size:15px; transition:.15s;}
  .opt:hover{background:var(--opt-hover); border-color:var(--primary); transform:translateX(2px);}
  .opt:disabled{cursor:default; transform:none;}
  .opt-key{flex:none; width:26px; height:26px; border-radius:50%; background:var(--primary-soft); color:var(--primary); font-weight:800; display:flex; align-items:center; justify-content:center; font-size:13px; transition:.15s;}
  .opt-txt{flex:1; line-height:1.5;}
  .opt.correct{border-color:var(--ok-bd); background:var(--ok-bg); color:var(--ok-ink); font-weight:700;}
  .opt.correct .opt-key{background:var(--ok-bd); color:#fff;}
  .opt.wrong{border-color:var(--bad-bd); background:var(--bad-bg); color:var(--bad-ink); text-decoration:line-through;}
  .opt.wrong .opt-key{background:var(--bad-bd); color:#fff;}
  .feedback{margin:10px 0 2px; padding:10px 14px; border-radius:10px; display:none; font-size:14px;}
  .feedback.ok{display:block; background:var(--ok-bg); border-left:4px solid var(--ok-bd); color:var(--ok-ink);}
  .feedback.bad{display:block; background:var(--bad-bg); border-left:4px solid var(--bad-bd); color:var(--bad-ink);}
  .feedback .explain{margin-top:5px; color:var(--sub); font-size:13.5px; font-weight:400;}
  .q-actions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .progress{font-size:13px; font-weight:700; color:var(--primary); background:var(--primary-soft); padding:4px 12px; border-radius:999px;}

  .notes{margin-top:18px; border-top:1px dashed var(--line); padding-top:14px;}
  .notes h4{margin:0 0 8px; color:var(--primary); font-size:14px;}
  #notes{min-height:80px; color:var(--sub); outline:none; background:#fbfcfe; border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  #notes:focus{background:var(--primary-soft); border-color:var(--primary);}

  /* 逐句精读浮动面板 */
  .sent-panel{position:fixed; top:84px; right:20px; width:380px; max-height:calc(100vh - 110px); overflow:auto; background:var(--panel); border:1px solid var(--primary); border-radius:var(--radius); box-shadow:var(--shadow-lg); transform:translateX(140%); opacity:0; transition:.28s cubic-bezier(.4,0,.2,1); z-index:60;}
  .sent-panel.open{transform:none; opacity:1;}
  .sp-head{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; border-radius:var(--radius) var(--radius) 0 0; font-weight:800;}
  .sp-close{background:rgba(255,255,255,.9); color:var(--primary); border:none; border-radius:8px; padding:3px 10px; cursor:pointer; font-size:13px; font-weight:700;}
  .sp-body{padding:14px 16px;}
  .sp-label{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--sub); margin:12px 0 4px; font-weight:800; display:flex; align-items:center; gap:6px;}
  .sp-label:first-child{margin-top:0;}
  .sp-label::before{content:""; width:3px; height:12px; background:var(--accent); border-radius:2px;}
  .sp-en{font-family:Georgia,serif; font-size:16px; line-height:1.8; color:var(--ink); padding:8px 12px; background:var(--primary-soft); border-radius:10px;}
  .sp-zh{font-size:15px; line-height:1.8; color:var(--primary); padding:8px 12px; background:#fbfcfe; border-radius:10px; border:1px solid var(--line);}
  .sp-an{font-size:14px; line-height:1.8; color:var(--ink); white-space:pre-wrap; padding:8px 12px; background:#fbfcfe; border-radius:10px; border:1px solid var(--line);}

  @media (max-width:880px){
    .main{height:auto; flex-direction:column;}
    .accum-grid{grid-template-columns:1fr;}
    .acc-cell{border-right:none; border-bottom:1px solid var(--line); padding:8px 0;}
  }

  /* 打印 / 导出 PDF */
  @media print {
    body{background:#fff;}
    .toolbar, .tabs, .q-actions, .trans-btn, .col-head span:last-child, #sentPanel, .sent-panel{display:none !important;}
    .main{height:auto !important; display:block !important; padding:0 !important;}
    .col{break-inside:avoid; border:1px solid #999 !important; margin:0 0 14px; border-radius:0 !important; box-shadow:none !important;}
    .col-head{background:var(--primary) !important; color:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .opt{border:1px solid #ccc !important; background:#fff !important; color:#000 !important; box-shadow:none !important; transform:none !important;}
    .opt.correct{background:var(--ok-bg) !important; border-color:var(--ok-bd) !important; color:var(--ok-ink) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .opt-key{background:#eee !important; color:#000 !important;}
    .trans{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    header{background:var(--primary) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; box-shadow:none !important;}
    .question{box-shadow:none !important;}
  }
  body.print-trans .trans{display:block !important;}
  body.print-notrans .trans{display:none !important;}
</style>
</head>
<body>

<header>
  <div class="course" id="courseTitle" contenteditable="true">高中英语阅读理解 · 课堂讲解</div>
  <div class="toolbar">
    <div class="grp">
      <span>字号</span>
      <button class="btn mini" onclick="changeFont(-1)">A−</button>
      <button class="btn mini" onclick="changeFont(0)">重置</button>
      <button class="btn mini" onclick="changeFont(1)">A＋</button>
    </div>
    <button class="btn mini" id="btnSent" onclick="toggleSentMode()">📝 逐句精读</button>
    <button class="btn mini" id="btnExplain" onclick="toggleExplain()">🧑‍🏫 讲解模式</button>
    <button class="btn mini" onclick="toggleAllTrans()">译 开/关</button>
    <button class="btn mini" onclick="toggleTheme()">🌙 夜间</button>
    <button class="btn mini" onclick="window.printStudent()">🖨 学生版</button>
    <button class="btn mini" onclick="window.printTeacher()">🖨 教师版</button>
    <button class="btn mini" onclick="resetAll()">恢复初始</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <div class="tab active" data-id="A" onclick="switchPassage('A')">A 篇</div>
  <div class="tab" data-id="B" onclick="switchPassage('B')">B 篇</div>
  <div class="tab" data-id="C" onclick="switchPassage('C')">C 篇</div>
  <div class="tab" data-id="D" onclick="switchPassage('D')">D 篇</div>
</nav>

<div class="main">
  <section class="col left">
    <div class="col-head">
      <span>📖 阅读原文</span>
      <span>
        <button class="btn ghost mini" onmousedown="event.preventDefault()" onclick="highlightSelection()">✏️ 高亮</button>
        <button class="btn ghost mini" onmousedown="event.preventDefault()" onclick="clearHighlights()">清除</button>
      </span>
    </div>
    <div class="col-body">
      <div id="reading" contenteditable="true"></div>

      <section class="accum">
        <div class="accum-head">📚 考点积累（可直接编辑）</div>
        <div class="accum-grid">
          <div class="acc-cell"><h4>🔠 重难点单词</h4><div id="words" contenteditable="true"></div></div>
          <div class="acc-cell"><h4>🔡 重点短语</h4><div id="phrases" contenteditable="true"></div></div>
          <div class="acc-cell"><h4>🎯 高频考点</h4><div id="points" contenteditable="true"></div></div>
        </div>
      </section>

      <section class="accum-tech">
        <div class="accum-tech-head">做题技巧（可直接编辑）</div>
        <div id="techniques" contenteditable="true"></div>
      </section>
    </div>
  </section>

  <section class="col right">
    <div class="col-head">
      <span>✅ 课堂练习</span>
      <span id="progress" class="progress"></span>
    </div>
    <div class="col-body">
      <div id="quiz"></div>

      <section class="notes">
        <h4>🖊️ 讲解留白（可编辑）</h4>
        <div id="notes" contenteditable="true"></div>
      </section>
    </div>
  </section>
</div>

<!-- 逐句精读浮动面板 -->
<aside id="sentPanel" class="sent-panel">
  <div class="sp-head">📝 逐句精读 <button class="sp-close" onclick="closeSent()">✕</button></div>
  <div class="sp-body">
    <div class="sp-label">英文</div><div class="sp-en" id="spEn"></div>
    <div class="sp-label">翻译</div><div class="sp-zh" id="spZh"></div>
    <div class="sp-label">结构拆解</div><div class="sp-an" id="spAn"></div>
  </div>
</aside>

<script>
/* ================================================================
   数据区：PASSAGES。每篇含
   text(英文HTML) / trans(段级中文) / sentences(逐句[{en,zh,analysis}]) /
   questions[] / words / phrases / points。
   ================================================================ */
/* ===PASSAGES_START=== */
const PASSAGES = {
  "A": {
    "text": "<h3>Demo</h3><p>（在此粘贴 A 篇阅读原文）</p>",
    "trans": "<p>（在此填写对应中文翻译）</p>",
    "sentences": [],
    "questions": [
      { "q": "1. （在此填写题干）", "options": ["A. 选项一","B. 选项二","C. 选项三","D. 选项四"], "answer": "B", "explain": "（在此填写解析）", "locate": "" }
    ],
    "words": ["（重难点单词，每行一条）"],
    "phrases": ["（重点短语，每行一条）"],
    "points": ["（高频考点，每行一条）"]
  },
  "B": {
    "text": "<h3>B 篇</h3><p>（在此粘贴 B 篇阅读原文）</p>",
    "trans": "<p>（在此填写对应中文翻译）</p>",
    "sentences": [],
    "questions": [
      { "q": "1. （在此填写题干）", "options": ["A. 选项一","B. 选项二","C. 选项三","D. 选项四"], "answer": "B", "explain": "（在此填写解析）", "locate": "" }
    ],
    "words": ["（重难点单词，每行一条）"],
    "phrases": ["（重点短语，每行一条）"],
    "points": ["（高频考点，每行一条）"]
  },
  "C": {
    "text": "<h3>C 篇</h3><p>（在此粘贴 C 篇阅读原文）</p>",
    "trans": "<p>（在此填写对应中文翻译）</p>",
    "sentences": [],
    "questions": [
      { "q": "1. （在此填写题干）", "options": ["A. 选项一","B. 选项二","C. 选项三","D. 选项四"], "answer": "B", "explain": "（在此填写解析）", "locate": "" }
    ],
    "words": ["（重难点单词，每行一条）"],
    "phrases": ["（重点短语，每行一条）"],
    "points": ["（高频考点，每行一条）"]
  },
  "D": {
    "text": "<h3>D 篇</h3><p>（在此粘贴 D 篇阅读原文）</p>",
    "trans": "<p>（在此填写对应中文翻译）</p>",
    "sentences": [],
    "questions": [
      { "q": "1. （在此填写题干）", "options": ["A. 选项一","B. 选项二","C. 选项三","D. 选项四"], "answer": "B", "explain": "（在此填写解析）", "locate": "" }
    ],
    "words": ["（重难点单词，每行一条）"],
    "phrases": ["（重点短语，每行一条）"],
    "points": ["（高频考点，每行一条）"]
  }
};
/* ===PASSAGES_END=== */

const LS_PREFIX = "eng_read_v2_";
let current = "A";
const fontSteps = [15,16,17,18,19,20,21,22];
let fontIdx = 3;
let transAll = false;
let sentMode = false;
let explainMode = false;

const $ = id => document.getElementById(id);
const tabsEl = $("tabs"), readingEl = $("reading"), quizEl = $("quiz"),
      wordsEl = $("words"), phrasesEl = $("phrases"), pointsEl = $("points"), techniquesEl = $("techniques"),
      notesEl = $("notes"), titleEl = $("courseTitle"), progressEl = $("progress"),
      sentPanel = $("sentPanel"), spEn = $("spEn"), spZh = $("spZh"), spAn = $("spAn"),
      btnSent = $("btnSent"), btnExplain = $("btnExplain");
const lsKey = (id, part) => LS_PREFIX + id + "_" + part;

function escapeHtml(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escapeAttr(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function buildQuiz(qs){
  return qs.map(q => {
    const qm = String(q.q||"").match(/^\s*(\d+)\s*[.\s、)、-]?\s*([\s\S]*)$/);
    const qnum = qm ? qm[1] : "";
    const qbody = qm ? qm[2] : (q.q||"");
    return `<div class="question" data-answer="${escapeAttr(q.answer)}" data-explain="${escapeAttr(q.explain)}" data-locate="${escapeAttr(q.locate||'')}">
      <div class="q-top">${qnum?`<span class="q-num">${escapeHtml(qnum)}</span>`:""}<p class="q-text">${escapeHtml(qbody)}</p></div>
      <div class="options">
        ${q.options.map(o=>{const m=String(o).match(/^\s*([A-Da-d])[.\s、)]\s*([\s\S]*)$/);const letter=m?m[1].toUpperCase():"";const txt=m?m[2]:o;return `<button type="button" class="opt" data-letter="${letter}"><span class="opt-key">${escapeHtml(letter)}</span><span class="opt-txt">${escapeHtml(txt)}</span></button>`;}).join("")}
      </div>
      <div class="feedback"></div>
      <div class="q-actions">
        <button type="button" class="btn ghost mini locate-btn">📍 定位原文</button>
        <button type="button" class="btn ghost mini reset-q">↺ 重做</button>
      </div>
    </div>`;
  }).join("");
}
function buildList(items){return items.map(i=>`<div class="acc-item">• ${escapeHtml(i)}</div>`).join("");}
function buildTech(items){return (items||[]).map((t,i)=>`<div class="tech-item"><span class="tech-num">${i+1}</span><span class="tech-txt">${escapeHtml(t)}</span></div>`).join("");}

function injectTrans(id){
  const transHtml = PASSAGES[id].trans || "";
  const transParas = (transHtml.match(/<p[^>]*>([\s\S]*?)<\/p>/gi) || []).map(m => m.replace(/<\/?p[^>]*>/gi, ""));
  readingEl.querySelectorAll(".trans, .trans-btn").forEach(e => e.remove());
  readingEl.querySelectorAll("p").forEach((p, i) => {
    const zh = transParas[i] || "";
    if (!zh) return;
    const t = document.createElement("div");
    t.className = "trans"; t.contentEditable = "false";
    t.style.display = transAll ? "block" : "none";
    t.textContent = zh;
    p.insertAdjacentElement("afterend", t);
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "trans-btn"; btn.contentEditable = "false"; btn.textContent = "译";
    btn.onclick = () => { t.style.display = t.style.display === "none" ? "block" : "none"; };
    p.appendChild(btn);
  });
}

function renderReading(id){
  if (sentMode && (PASSAGES[id].sentences||[]).length){
    const ss = PASSAGES[id].sentences;
    readingEl.classList.add("sent-mode");
    readingEl.contentEditable = "false";
    readingEl.innerHTML = ss.map((s,i)=>`<p class="sent" data-i="${i}">${escapeHtml(s.en||"")}</p>`).join("");
  } else {
    if (sentMode) { sentMode=false; btnSent.classList.remove("active"); }
    readingEl.classList.remove("sent-mode");
    readingEl.contentEditable = "true";
    readingEl.innerHTML = localStorage.getItem(lsKey(id,"reading")) ?? PASSAGES[id].text;
    injectTrans(id);
  }
}

function renderPassage(id){
  current = id;
  [...tabsEl.children].forEach(b => b.classList.toggle("active", b.dataset.id === id));
  renderReading(id);
  quizEl.innerHTML = localStorage.getItem(lsKey(id,"quiz")) ?? buildQuiz(PASSAGES[id].questions);
  wordsEl.innerHTML   = localStorage.getItem(lsKey(id,"words"))    ?? buildList(PASSAGES[id].words);
  phrasesEl.innerHTML = localStorage.getItem(lsKey(id,"phrases"))  ?? buildList(PASSAGES[id].phrases);
  pointsEl.innerHTML  = localStorage.getItem(lsKey(id,"points"))   ?? buildList(PASSAGES[id].points);
  techniquesEl.innerHTML = localStorage.getItem(lsKey(id,"techniques")) ?? buildTech(PASSAGES[id].techniques || ["（在此添加针对本篇的应试技巧，如：先读题干再回原文定位、关注同义替换、排除绝对化选项等）"]);
  notesEl.innerHTML   = localStorage.getItem(lsKey("global","notes")) ?? "<p>（讲解留白：录课时可在此手写板书、记录学生易错点与当堂生成内容）</p>";
  titleEl.innerHTML   = localStorage.getItem(lsKey("global","title")) ?? "高中英语阅读理解 · 课堂讲解";
  applyFont(); applyTheme(); applyExplainUI(); updateProgress();
}
function switchPassage(id){ renderPassage(id); }

/* ---------- 逐句精读 ---------- */
function anySentences(id){ return (PASSAGES[id].sentences||[]).length > 0; }
function toggleSentMode(){
  if (!sentMode && !anySentences(current)){ alert("本篇尚未生成逐句精读数据（请用 gen_sentences.py 生成）。"); return; }
  sentMode = !sentMode;
  btnSent.classList.toggle("active", sentMode);
  if (!sentMode) closeSent();
  renderReading(current);
}
function showSent(i){
  const s = (PASSAGES[current].sentences||[])[i]; if (!s) return;
  spEn.textContent = s.en || "";
  spZh.textContent = s.zh || "";
  spAn.textContent = s.analysis || "";
  sentPanel.classList.add("open");
}
function closeSent(){ sentPanel.classList.remove("open"); }
readingEl.addEventListener("click", e => {
  if (sentMode){
    const p = e.target.closest(".sent");
    if (p) showSent(+p.dataset.i);
  }
});

/* ---------- 做题交互 ---------- */
quizEl.addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (opt) { answer(opt); return; }
  const loc = e.target.closest(".locate-btn");
  if (loc) { locateInReading(loc.closest(".question").dataset.locate); return; }
  const rst = e.target.closest(".reset-q");
  if (rst) { resetQ(rst.closest(".question")); return; }
});

function answer(opt){
  const q = opt.closest(".question");
  if (q.dataset.answered) return;
  q.dataset.answered = "1";
  const chosen = opt.dataset.letter, correct = q.dataset.answer;
  q.querySelectorAll(".opt").forEach(o => {
    o.disabled = true;
    if (o.dataset.letter === correct) o.classList.add("correct");
    if (o.dataset.letter === chosen && chosen !== correct) o.classList.add("wrong");
  });
  const fb = q.querySelector(".feedback");
  const ex = q.dataset.explain || "";
  if (chosen === correct){
    fb.className = "feedback ok";
    fb.innerHTML = "✓ 回答正确！<div class=\"explain\">" + escapeHtml(ex) + "</div>";
  } else {
    fb.className = "feedback bad";
    fb.innerHTML = "✗ 答错了，正确答案：<b>" + escapeHtml(correct) + "</b><div class=\"explain\">" + escapeHtml(ex) + "</div>";
  }
  updateProgress(); saveRegion("quiz");
}
function resetQ(q){
  delete q.dataset.answered;
  q.querySelectorAll(".opt").forEach(o => { o.disabled = false; o.classList.remove("correct","wrong"); });
  q.querySelector(".feedback").innerHTML = "";
  updateProgress(); saveRegion("quiz");
}

/* ---------- 教师讲解模式：一键展开全部答案 ---------- */
function toggleExplain(){
  explainMode = !explainMode;
  btnExplain.classList.toggle("active", explainMode);
  if (explainMode){
    quizEl.querySelectorAll(".question").forEach(q => {
      if (q.dataset.answered) return;
      q.dataset.answered = "1";
      const correct = q.dataset.answer;
      q.querySelectorAll(".opt").forEach(o => { o.disabled = true; if (o.dataset.letter === correct) o.classList.add("correct"); });
      const fb = q.querySelector(".feedback");
      fb.className = "feedback ok";
      fb.innerHTML = "🔑 答案：<b>" + escapeAttr(q.dataset.answer) + "</b><div class=\"explain\">" + escapeHtml(q.dataset.explain||"") + "</div>";
    });
    updateProgress();
    // 讲解模式不持久化，避免把答案留给学生
  } else {
    quizEl.querySelectorAll(".question").forEach(resetQ);
    localStorage.removeItem(lsKey(current, "quiz"));
  }
  applyExplainUI();
}
function applyExplainUI(){ /* 占位：界面状态已通过按钮 active 表达 */ }

function updateProgress(){
  const qs = [...quizEl.querySelectorAll(".question")];
  const total = qs.length;
  const done = qs.filter(q => q.dataset.answered).length;
  const right = qs.filter(q => q.dataset.answered && !q.querySelector(".opt.wrong")).length;
  progressEl.textContent = total ? `进度 ${done}/${total}　答对 ${right}/${total}` : "";
}

function saveRegion(name){
  if (name === "notes")  { localStorage.setItem(lsKey("global", "notes"), notesEl.innerHTML); return; }
  if (name === "title")  { localStorage.setItem(lsKey("global", "title"), titleEl.innerHTML); return; }
  if (name === "quiz")   { localStorage.setItem(lsKey(current, "quiz"), quizEl.innerHTML); return; }
  const map = { reading: readingEl, words: wordsEl, phrases: phrasesEl, points: pointsEl, techniques: techniquesEl };
  localStorage.setItem(lsKey(current, name), map[name].innerHTML);
}

/* ---------- 字号 / 主题 / 翻译 / 高亮 / 定位 ---------- */
function changeFont(d){ if(d===0) fontIdx=3; else fontIdx=Math.max(0, Math.min(fontSteps.length-1, fontIdx+d)); applyFont(); }
function applyFont(){ readingEl.style.fontSize = fontSteps[fontIdx] + "px"; }
function applyTheme(){ document.documentElement.dataset.theme = localStorage.getItem("eng_read_theme") || ""; }
function toggleTheme(){ const t = document.documentElement.dataset.theme==="dark" ? "" : "dark"; document.documentElement.dataset.theme = t; localStorage.setItem("eng_read_theme", t); }
function toggleAllTrans(){ transAll = !transAll; readingEl.querySelectorAll(".trans").forEach(t => t.style.display = transAll ? "block" : "none"); }

function highlightSelection(){
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed){ alert("请先在左侧原文中拖选要标注的文字"); return; }
  const range = sel.getRangeAt(0);
  if (!readingEl.contains(range.commonAncestorContainer)){ alert("请在左侧原文区域内选中文字"); return; }
  const mark = document.createElement("mark"); mark.className = "hl";
  try { range.surroundContents(mark); }
  catch(e){ const frag = range.extractContents(); mark.appendChild(frag); range.insertNode(mark); }
  sel.removeAllRanges(); saveRegion("reading");
}
function clearHighlights(){
  if (!confirm("确定清除当前篇章的所有高亮标注吗？")) return;
  readingEl.querySelectorAll("mark.hl").forEach(m => { const p=m.parentNode; while(m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); p.normalize(); });
  saveRegion("reading");
}
function locateInReading(text){
  if (!text){ alert("该题未设置定位文本（可在数据的 locate 字段补充）"); return; }
  readingEl.querySelectorAll(".locate").forEach(s => { const p=s.parentNode; while(s.firstChild) p.insertBefore(s.firstChild, s); p.removeChild(s); p.normalize(); });
  const walker = document.createTreeWalker(readingEl, NodeFilter.SHOW_TEXT);
  let node, found = false;
  while (node = walker.nextNode()){
    const i = node.nodeValue.indexOf(text);
    if (i >= 0){
      const r = document.createRange(); r.setStart(node, i); r.setEnd(node, i + text.length);
      const span = document.createElement("span"); span.className = "locate"; r.surroundContents(span);
      found = true; break;
    }
  }
  if (!found) alert("未在原文中找到定位文本：" + text);
}
function resetAll(){
  if (!confirm("确定清空所有标注与编辑，恢复初始内容吗？")) return;
  Object.keys(localStorage).forEach(k => { if (k.startsWith(LS_PREFIX)) localStorage.removeItem(k); });
  location.reload();
}

/* ---------- 打印 / 导出 PDF ---------- */
function doPrint(cls){
  document.body.classList.add(cls);
  window.print();
}
window.printStudent = () => doPrint("print-notrans");
window.printTeacher = () => doPrint("print-trans");
window.onafterprint = () => { document.body.classList.remove("print-notrans","print-trans"); };

/* ---------- 自动保存 ---------- */
["reading","words","phrases","points","techniques"].forEach(name => $(name).addEventListener("input", () => saveRegion(name)));
notesEl.addEventListener("input", () => saveRegion("notes"));
titleEl.addEventListener("input", () => saveRegion("title"));

renderPassage("A");
</script>
